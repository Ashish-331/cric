# Cric — Supabase Local Configuration
project_id = "cric"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://localhost:8081", "cric://*"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
# Controlled test phone numbers for local development (Option A: zero SMS carrier cost)
# Exercises real Supabase Auth sessions, JWTs, and RLS without SMS gateways
[auth.sms.test_otp]
"+919876543210" = "123456" # Organizer O
"+919876543211" = "123456" # Captain C
